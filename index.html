<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاي جمر الريف</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#150e0b;--card:#211611;--line:#3a2a20;--maroon:#c8431f;--gold:#e0ab4a;--text:#f6ebd9;--mute:#b9a58c;--acc:#e0ab4a;--onacc:#241408;--soft:#34231a;--ok:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Amiri,"Traditional Arabic",serif;font-size:18px;line-height:1.6;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{font-family:"Aref Ruqaa",Amiri,serif;font-size:22px;font-weight:700;color:var(--gold)}
.call{border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 18px;font-weight:700}
.hero{position:relative;overflow:hidden;text-align:center;padding:30px 20px 34px;background:radial-gradient(ellipse at 50% 120%,#7a2a12 0,#3a150b 38%,var(--bg) 75%);color:var(--text)}
.badge{margin:0 auto 10px;display:grid;place-items:center;filter:drop-shadow(0 0 20px rgba(224,85,43,.4))}
.badge img{width:300px;max-width:82%;height:auto}
.hero h1{font-family:"Aref Ruqaa",Amiri,serif;font-size:clamp(46px,14vw,72px);line-height:1.2;margin:0;color:var(--gold)}
.hero p{margin:6px auto 20px;max-width:30ch;font-size:18px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 26px;font-size:18px;font-weight:700;background:var(--gold);color:#3a1005;min-height:52px;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid var(--gold)}
.btn.wa{background:var(--ok);color:#052512}
.ember{position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px 3px #e0552b;opacity:0;animation:rise 6s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-300px) translateX(var(--dx));opacity:0}}
@media (prefers-reduced-motion:reduce){.ember{display:none}html{scroll-behavior:auto}}
.how{display:flex;gap:8px;padding:14px 16px;justify-content:center;flex-wrap:wrap;color:var(--mute);font-size:14px}
.how span{background:var(--soft);border-radius:999px;padding:5px 14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 18px;font-size:16px}
.tab[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
main{max-width:720px;margin:0 auto;padding:6px 16px}
.gh{margin:20px 0 0;font-family:"Aref Ruqaa",Amiri,serif;font-size:20px;color:var(--acc)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.item h3{margin:0;font-family:"Aref Ruqaa",Amiri,serif;font-size:22px;display:flex;gap:8px;align-items:center}
.item p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:10px}.r1 p{margin:0}
.new{background:var(--maroon);color:#fff8e6;font-size:12px;border-radius:6px;padding:0 8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{flex:1;min-width:80px;border:1.5px solid var(--acc);background:transparent;color:var(--text);border-radius:12px;padding:8px;font-size:15px;min-height:52px}
.size b{display:block;color:var(--acc);font-size:17px}
.size:active{background:var(--acc);color:var(--onacc)}.size:active b{color:var(--onacc)}
.r1 .size{flex:none;min-width:86px}
.q{margin:16px 0 4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 16px;font-size:16px}
.chip[aria-pressed=true]{border-color:var(--acc);background:var(--soft);font-weight:700}
.note{margin:16px 0;padding:12px;border:1px dashed var(--acc);border-radius:12px;text-align:center;color:var(--mute);font-size:15px}
.bar{position:fixed;inset:auto 0 0 0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar .btn{width:100%;justify-content:space-between;background:var(--acc);color:var(--onacc)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none}.sheet.on{display:block}
.panel{position:absolute;inset:auto 0 0 0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.panel h2{margin:0 0 8px;font-family:"Aref Ruqaa",Amiri,serif;color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--text);font-size:20px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:12px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font-size:16px;min-height:50px}
.seg button[aria-pressed=true]{border-color:var(--acc);background:var(--soft);font-weight:700}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
input,select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
.car{display:none;background:var(--card);border-radius:12px;padding:2px 12px 12px;margin-bottom:8px}.car.on{display:block}
.x{float:left;background:none;border:0;color:var(--mute);font-size:30px}
footer{text-align:center;color:var(--mute);padding:26px 16px;margin-top:20px;border-top:1px solid var(--line)}
footer .cta{margin-bottom:14px}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.seg4 button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px;font-size:16px}.seg4 button[aria-pressed=true]{border-color:var(--acc);background:var(--soft);font-weight:700}
.arrived{display:none;margin-top:10px;width:100%}.arrived.on{display:inline-flex}
.hero p{font-size:21px}.tab,.chip,.seg button,.seg4 button{font-size:18px}.size{font-size:17px}.size b{font-size:19px}.btn{font-size:20px}
#fbt{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:110px;margin:8px 0}
</style>
</head>

var cart={},mode="shop",cat="tea",sel=0,sugar="مضبوط";var DR=["tea","coffee","milk","glass","thermos"];
var $=function(i){return document.getElementById(i)};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}
var em=$("embers");for(var i=0;i<12;i++){var e=document.createElement("i");e.className="ember";e.style.left=(4+i*8)+"%";e.style.animationDelay=(i*.5)+"s";e.style.setProperty("--dx",((i%2?1:-1)*(8+i*3))+"px");em.appendChild(e)}
function sizes(it,ix,single){return it.s.map(function(s,si){return '<button class="size" data-i="'+ix+'" data-s="'+si+'"><b>'+s[1]+' ر.س</b>'+(s[0]||"أضف")+'</button>'}).join("")}
function tabs(){$("tabs").innerHTML=CATS.map(function(c){return '<button class="tab" data-c="'+c[0]+'" aria-pressed="'+(c[0]==cat)+'">'+c[1]+'</button>'}).join("")}
function menu(){var L=DATA[cat],h="";
 if(cat=="tea"){h+='<div class="q">وش تحب نحط لك في الشاي؟</div><div class="chips">'+L.map(function(it,i){return '<button class="chip" data-t="'+i+'" aria-pressed="'+(i==sel)+'">'+it.n+'</button>'}).join("")+'</div>';
  var it=L[sel];h+='<div class="item" style="margin-top:14px"><h3>شاي '+it.n+'</h3>'+(it.d?'<p>'+it.d+'</p>':'<p></p>')+'<div class="sizes">'+sizes(it,sel)+'</div></div>'}
 else L.forEach(function(it,ix){if(it.g)h+='<div class="gh">'+it.g+'</div>';
  var one1=it.s.length==1&&!it.s[0][0];
  h+=one1?'<div class="item r1"><div><h3>'+it.n+'</h3>'+(it.d?'<p>'+it.d+'</p>':'')+'</div>'+sizes(it,ix)+'</div>':'<div class="item"><h3>'+it.n+(it.nw?'<span class="new">جديد</span>':'')+'</h3>'+(it.d?'<p>'+it.d+'</p>':'<p></p>')+'<div class="sizes">'+sizes(it,ix)+'</div></div>'});
 if(NOTES[cat])h+='<div class="note">'+NOTES[cat]+'</div>';
 $("menu").innerHTML=h}
function add(ix,si){var it=DATA[cat][ix],s=it.s[si],k=cat+"|"+ix+"|"+si,pre=cat=="tea"?"شاي ":"";
 if(!cart[k])cart[k]={n:pre+it.n+(it.g=="ترامس نوع آخر"?" (نوع آخر)":"")+(s[0]?" ("+s[0]+")":""),p:s[1],q:0,cat:cat};cart[k].q++;draw()}
function totals(){var q=0,t=0;for(var k in cart){q+=cart[k].q;t+=cart[k].q*cart[k].p}return[q,t]}
function draw(){var T=totals();$("bar").hidden=T[0]==0;$("cnt").textContent=T[0];$("sum").textContent=T[1]+" ر.س";$("tot").textContent=T[1]+" ر.س";
 $("lines").innerHTML=Object.keys(cart).map(function(k){var c=cart[k];return '<div class="row"><div>'+c.n+'<br><small style="color:var(--mute)">'+c.p*c.q+' ر.س</small></div><div class="qty"><button data-k="'+k+'" data-d="-1" aria-label="أنقص">−</button><b>'+c.q+'</b><button data-k="'+k+'" data-d="1" aria-label="زد">+</button></div></div>'}).join("");
 $("sugarbox").style.display=hasDrink()?"block":"none";if(T[0]==0)$("sheet").classList.remove("on")}
function hasDrink(){return Object.keys(cart).some(function(k){return DR.indexOf(cart[k].cat)>-1})}
function carText(){return"السيارة: "+($("ctype").value||"-")+"، "+($("ccolor").value||"-")+"، لوحة: "+($("cplate").value||"-")}
function fb(h,x,u,l){$("fbh").textContent=h;$("fbt").value=x;$("fbl").href=u;$("fbl").textContent=l;$("fbc").textContent="نسخ";$("fb").classList.add("on")}
function wa(t){var u="https://wa.me/"+PHONE+"?text="+encodeURIComponent(t),w=null;try{w=window.open(u,"_blank")}catch(e){}if(!w)fb("ما انفتح الواتساب؟ انسخ الطلب وأرسله على 0535536731",t,u,"فتح الواتساب")}
var away=false;window.addEventListener("blur",function(){away=true});document.addEventListener("visibilitychange",function(){away=true});
document.querySelector(".call").addEventListener("click",function(){away=false;setTimeout(function(){if(!away)fb("اتصل بنا على 0535536731","0535536731","tel:+966535536731","اتصال")},1000)});
$("fbc").onclick=function(){var x=$("fbt");x.select();try{document.execCommand("copy")}catch(e){}try{navigator.clipboard.writeText(x.value)}catch(e){}this.textContent="تم النسخ"};
$("fbx").onclick=function(){$("fb").classList.remove("on")};$("fb").addEventListener("click",function(e){if(e.target==this)this.classList.remove("on")});
function saveInfo(){store("jr_ct",$("ctype").value);store("jr_cc",$("ccolor").value);store("jr_cp",$("cplate").value);store("jr_nm",$("name").value)}
function setMode(m){mode=m;[].forEach.call($("mode").children,function(b){b.setAttribute("aria-pressed",b.dataset.m==m)});$("carbox").classList.toggle("on",m=="car");$("here").classList.toggle("on",m=="car")}
document.addEventListener("click",function(ev){var t=ev.target.closest("button");if(!t)return;
 if(t.classList.contains("tab")){cat=t.dataset.c;tabs();menu()}
 else if(t.classList.contains("chip")){sel=+t.dataset.t;menu()}
 else if(t.classList.contains("size")){add(+t.dataset.i,+t.dataset.s);if(navigator.vibrate)navigator.vibrate(20)}
 else if(t.dataset.k){var c=cart[t.dataset.k];c.q+=+t.dataset.d;if(c.q<=0)delete cart[t.dataset.k];draw()}
 else if(t.dataset.sg){sugar=t.dataset.sg;[].forEach.call($("sugar").children,function(b){b.setAttribute("aria-pressed",b===t)})}
 else if(t.dataset.m)setMode(t.dataset.m)});
$("open").onclick=function(){$("sheet").classList.add("on")};
$("close").onclick=function(){$("sheet").classList.remove("on")};
$("sheet").addEventListener("click",function(e){if(e.target==this)this.classList.remove("on")});
$("carlink").onclick=function(){setMode("car")};
$("chat").onclick=function(e){e.preventDefault();wa("السلام عليكم")};
$("send").onclick=function(){var T=totals();if(!T[0])return;saveInfo();
 var L=["السلام عليكم، أبغى طلب من جمر الريف:"];
 for(var k in cart){var c=cart[k];L.push("- "+c.q+" × "+c.n+" = "+c.q*c.p+" ر.س")}
 L.push("المجموع: "+T[1]+" ر.س","الاستلام: "+(mode=="car"?"من السيارة":"من المحل"));
 if(mode=="car")L.push(carText());
 if(hasDrink())L.push("السكر: "+sugar);
 L.push("الوقت: "+$("when").value);
 if($("name").value)L.push("الاسم: "+$("name").value);
 if($("note").value)L.push("ملاحظات: "+$("note").value);
 wa(L.join("\n"))};
$("here").onclick=function(){saveInfo();wa("وصلت. "+carText()+($("name").value?"\nالاسم: "+$("name").value:""))};
$("ctype").value=store("jr_ct");$("ccolor").value=store("jr_cc");$("cplate").value=store("jr_cp");$("name").value=store("jr_nm");
tabs();menu();draw();
</script>
</body>
</html>
