<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta property="og:title" content="شاي جمر الريف - الأصالة في كل قطرة">
<meta property="og:description" content="شاي على الجمر، يجهز لك قبل لا توصل. اطلب الآن واستلم من السيارة.">
<meta property="og:image" content="https://shahi-aljamr.vercel.app/logo.jpg">
<meta property="og:url" content="https://shahi-aljamr.vercel.app">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شاي جمر الريف - الأصالة في كل قطرة</title>
    <!-- استدعاء خطوط جوجل (Tajawal) لمظهر عصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     
    <style>
        /* المتغيرات الأساسية (الوضع الفاتح) - ألوان احترافية ومريحة */
        :root {
            --bg-color: #f4f6f8;
            --surface-color: #ffffff;
            --surface-hover: #f8f9fa;
            --text-main: #1a1d20;
            --text-muted: #6c757d;
            
            /* ألوان هوية الجمر */
            --brand-primary: #e65100;
            --brand-gradient: linear-gradient(135deg, #ff7043, #e65100);
            --brand-light: #fff3e0;
            
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            
            /* ظلال احترافية */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(230, 81, 0, 0.08);
            --shadow-lg: 0 24px 48px rgba(0,0,0,0.12);
            --glass-bg: rgba(255, 255, 255, 0.85);
            
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 999px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* متغيرات الوضع الداكن (تصميم ليلي فاخر) */
        [data-theme="dark"] {
            --bg-color: #0b0f14;
            --surface-color: #151a21;
            --surface-hover: #1e252e;
            --text-main: #f8f9fa;
            --text-muted: #94a3b8;
            
            --brand-primary: #ff8a65;
            --brand-gradient: linear-gradient(135deg, #ffab91, #ff7043);
            --brand-light: rgba(255, 112, 67, 0.1);
            
            --border-color: #272f3a;
            --shadow-md: 0 8px 24px rgba(255, 112, 67, 0.15);
            --shadow-lg: 0 24px 48px rgba(0,0,0,0.4);
            --glass-bg: rgba(21, 26, 33, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
            padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
        }

        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 3px; }

        /* شريط التنقل (Glassmorphism Header) */
        header {
            background-color: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .nav-actions { display: flex; align-items: center; gap: 12px; }

        .call-btn {
            background: var(--brand-light);
            color: var(--brand-primary);
            border-radius: var(--radius-pill);
            padding: 8px 20px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .call-btn:hover { background: var(--brand-primary); color: #fff; transform: translateY(-2px); }

        .theme-toggle {
            color: var(--text-main);
            font-size: 1.3rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .theme-toggle:hover { color: var(--brand-primary); transform: rotate(15deg) scale(1.05); }

        /* القسم الرئيسي (Hero Section - Cinematic Look) */
        .hero {
            margin-top: 70px;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            
            /* --- التعديل هنا: فصل الخصائص لحل مشكلة الظهور في الجوال --- */
            background-color: var(--surface-color);
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('logo.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: contain; /* لاحتواء الصورة بالكامل بدون قص */
            /* ------------------------------------------------------------- */
            
            color: white;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            min-height: 40vh; /* لضمان وجود مساحة كافية لعرض الصورة */
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(230, 81, 0, 0.4);
            z-index: 2;
        }

        .hero p {
            font-size: 1.15rem;
            color: #f1f5f9;
            margin-bottom: 2rem;
            font-weight: 500;
            z-index: 2;
        }

        .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 2; }

        .btn {
            background: var(--brand-gradient);
            color: white;
            padding: 14px 32px;
            border-radius: var(--radius-pill);
            font-size: 1.1rem;
            font-weight: 800;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow-md);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(230, 81, 0, 0.25); }
        .btn:active { transform: translateY(1px); }

        .btn.ghost {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255,255,255,0.4);
            color: white;
            box-shadow: none;
        }
        .btn.ghost:hover { background: white; color: var(--brand-primary); border-color: white; }
        .btn.wa { background: var(--success); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2); }
        .btn.wa:hover { background: #059669; }

        /* الأقسام (Tabs) - تصميم عائم */
        .tabs-wrapper {
            position: sticky;
            top: 73px;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .tabs {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 20px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab {
            flex: none;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: var(--radius-pill);
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .tab[aria-pressed=true] {
            background: var(--text-main);
            color: var(--surface-color);
            border-color: var(--text-main);
            transform: scale(1.05);
        }

        /* القائمة (Menu Container) */
        main { max-width: 800px; margin: 0 auto; padding: 20px; }

        .gh { margin: 30px 0 15px; font-size: 1.4rem; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .gh::before { content: ''; display: block; width: 6px; height: 24px; background: var(--brand-gradient); border-radius: 4px; }
        
        /* كروت المنتجات */
        .item {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 20px 0;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
        }
        .item:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(230, 81, 0, 0.3);
            transform: translateY(-2px);
        }
        
        .item h3 { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main); display: flex; align-items: center; gap: 10px;}
        .item p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; font-weight: 500; }
        
        .r1 { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;}
        .r1 > div { flex: 1; min-width: 200px; }
        .r1 .sizes { flex: none; }

        /* بادج (جديد) */
        .new {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            font-size: 0.75rem;
            border-radius: 6px;
            padding: 4px 10px;
            font-weight: 800;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-right: auto;
        }
        
        /* أزرار الأحجام */
        .sizes { display: flex; gap: 12px; flex-wrap: wrap; }
        .size {
            flex: 1;
            min-width: 100px;
            background: var(--bg-color);
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius-md);
            padding: 14px 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .size b { color: var(--brand-primary); font-size: 1.15rem; font-weight: 900; }
        .size:hover { background: var(--surface-hover); border-color: var(--brand-primary); }
        .size:active { transform: scale(0.96); }

        /* خيارات التخصيص (Chips) */
        .q { margin: 10px 0 15px; font-weight: 800; font-size: 1.2rem; color: var(--text-main); }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .chip {
            border: 1.5px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            border-radius: var(--radius-pill);
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .chip:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
        .chip[aria-pressed=true] {
            border-color: var(--brand-primary);
            background: var(--brand-light);
            color: var(--brand-primary);
            font-weight: 800;
        }

        .note {
            margin: 25px 0; padding: 20px; border: 1.5px dashed var(--brand-primary);
            border-radius: var(--radius-lg); text-align: center; color: var(--brand-primary);
            background: var(--brand-light); font-weight: 600; font-size: 0.95rem;
        }

        /* شريط السلة العائم السحري (Floating Bottom Bar) */
        .bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 999;
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(to top, var(--bg-color) 70%, transparent);
            pointer-events: none;
            display: flex;
            justify-content: center;
        }
        .bar .btn {
            pointer-events: auto;
            width: 100%;
            max-width: 500px;
            justify-content: space-between;
            font-size: 1.2rem;
            padding: 18px 30px;
            box-shadow: 0 10px 30px rgba(230, 81, 0, 0.4);
            animation: pulseCart 2s infinite;
        }
        @keyframes pulseCart {
            0% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(230, 81, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0); }
        }

        /* نافذة السلة (Bottom Sheet) المنبثقة من الأسفل */
        .sheet {
            position: fixed;
            inset: 0;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .sheet.on { opacity: 1; visibility: visible; }
        
        .panel {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translate(-50%, 100%);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--surface-color);
            border-radius: 32px 32px 0 0;
            padding: 30px 24px calc(30px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -15px 40px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sheet.on .panel { transform: translate(-50%, 0); }
        
        .panel h2 { margin: 0 0 20px; color: var(--text-main); font-weight: 900; font-size: 1.6rem; text-align: center; }
        
        /* عناصر داخل السلة */
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 18px 0; border-bottom: 1px solid var(--border-color); }
        .row-info { font-weight: 700; font-size: 1.1rem; }
        .row-info small { color: var(--brand-primary); font-weight: 800; font-size: 0.95rem; display: block; margin-top: 4px;}
        
        .qty { display: flex; align-items: center; gap: 15px; background: var(--bg-color); border-radius: var(--radius-pill); padding: 4px; }
        .qty button {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--surface-color); color: var(--text-main);
            font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-sm); transition: var(--transition);
        }
        .qty button:hover { background: var(--text-main); color: var(--surface-color); }
        .qty b { font-size: 1.2rem; min-width: 24px; text-align: center; color: var(--text-main); font-weight: 800;}
        
        .total { display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: 900; padding: 25px 0; color: var(--text-main); border-bottom: 2px dashed var(--border-color); margin-bottom: 20px;}
        .total span:last-child { color: var(--brand-primary); }
        
        /* أزرار الاختيار داخل السلة */
        .seg, .seg4 { display: grid; gap: 12px; margin: 15px 0 25px; }
        .seg { grid-template-columns: 1fr 1fr; }
        .seg4 { grid-template-columns: 1fr 1fr; }
        
        .seg button, .seg4 button {
            border: 1.5px solid var(--border-color); background: var(--bg-color); color: var(--text-muted);
            border-radius: var(--radius-md); padding: 14px; font-size: 1rem; font-weight: 700; transition: var(--transition);
        }
        .seg button[aria-pressed=true], .seg4 button[aria-pressed=true] {
            border-color: var(--brand-primary); background: var(--brand-light); color: var(--brand-primary);
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.1);
        }

        /* الحقول */
        label { display: block; font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin: 20px 0 10px; }
        input, select, textarea {
            width: 100%; background: var(--bg-color); color: var(--text-main);
            border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; 
            font-family: inherit; font-size: 1.05rem; font-weight: 600; transition: var(--transition);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--brand-primary); background: var(--surface-color); box-shadow: 0 0 0 4px var(--brand-light); }
        input::placeholder, textarea::placeholder { color: var(--text-muted); font-weight: 500; }

        .car { display: none; background: var(--bg-color); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .car.on { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px);} to { opacity: 1; transform: translateY(0);} }
        
        .x { 
            position: absolute; left: 24px; top: 24px;
            background: var(--bg-color); width: 40px; height: 40px; border-radius: 50%;
            color: var(--text-main); font-size: 24px; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .x:hover { background: var(--danger); color: white; transform: rotate(90deg); }
        
        .arrived { display: none; margin-top: 15px; width: 100%; }
        .arrived.on { display: inline-flex; }

        #fbt { min-height: 140px; resize: vertical; margin-bottom: 15px;}

        /* التذييل */
        footer {
            background-color: var(--surface-color);
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
        }
        footer .cta { margin-bottom: 25px; justify-content: center; }
        footer p { font-weight: 600; font-size: 1.1rem; margin-bottom: 8px;}
        
        @media (max-width: 768px) {
            .nav-container { padding: 1rem; }
            .hero { padding: 3rem 1.5rem; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;}
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1rem; }
            .item { padding: 20px 15px; }
            .r1 > div { flex: 100%; text-align: center; margin-bottom: 15px;}
            .r1 .sizes { flex: 100%; justify-content: center;}
            .panel { padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-fire-flame-curved"></i>
                جمر الريف
            </a>
            
            <div class="nav-actions">
                <a class="call-btn" href="tel:+966535536731"><i class="fa-solid fa-phone"></i> اتصل</a>
                <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- القسم الرئيسي -->
    <section class="hero">
        <h1>شاي جمر الريف</h1>
        <p>مذاق الأصالة على الجمر.. نجهزه لك قبل لا توصل.</p>
        <div class="cta">
            <a class="btn" href="#menu"><i class="fa-solid fa-mug-hot"></i> اطلب الآن</a>
            <a class="btn ghost" href="#menu" id="carlink"><i class="fa-solid fa-car-side"></i> استلام من السيارة</a>
        </div>
    </section>

    <!-- التبويبات -->
    <div class="tabs-wrapper">
        <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
    </div>
    
    <!-- القائمة -->
    <main id="menu"></main>

    <!-- التذييل -->
    <footer>
        <div class="cta">
            <a class="btn wa" id="chat" href="#"><i class="fa-brands fa-whatsapp"></i> تواصل واتساب</a>
            <a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=%D8%B4%D8%A7%D9%8A%20%D8%AC%D9%85%D8%B1%20%D8%A7%D9%84%D8%B1%D9%8A%D9%81%20%D8%B9%D9%86%D9%8A%D8%B2%D8%A9" target="_blank" rel="noopener" style="color: var(--text-main); border-color: var(--border-color);"><i class="fa-solid fa-location-dot"></i> خريطة الفرع</a>
        </div>
        <p>شاي جمر الريف، عنيزة</p>
        <p dir="ltr" style="color: var(--brand-primary); font-weight: 800; font-size: 1.2rem;"><a href="tel:+966535536731">0535536731</a></p>
    </footer>

    <!-- شريط السلة السفلي -->
    <div class="bar" id="bar" hidden>
        <button class="btn" id="open">
            <span><i class="fa-solid fa-cart-shopping"></i> عرض السلة (<span id="cnt">0</span>)</span>
            <span id="sum">0 ر.س</span>
        </button>
    </div>

    <!-- نافذة السلة -->
    <div class="sheet" id="sheet">
        <div class="panel" role="dialog" aria-label="سلة الطلب">
            <button class="x" id="close" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            <h2>مراجعة الطلب</h2>
            
            <div id="lines"></div>
            
            <div class="total"><span>المجموع</span><span id="tot">0 ر.س</span></div>
            
            <label>طريقة الاستلام</label>
            <div class="seg" id="mode">
                <button data-m="shop" aria-pressed="true"><i class="fa-solid fa-store"></i> من المحل</button>
                <button data-m="car" aria-pressed="false"><i class="fa-solid fa-car"></i> من السيارة</button>
            </div>
            
            <div class="car" id="carbox">
                <label for="ctype">نوع السيارة</label><input id="ctype" placeholder="مثال: كامري">
                <label for="ccolor">اللون</label><input id="ccolor" placeholder="مثال: أبيض">
                <label for="cplate">رقم اللوحة</label><input id="cplate" placeholder="مثال: أ ب ج 1234">
            </div>
            
            <div id="sugarbox" style="display:none">
                <label>مستوى السكر</label>
                <div class="seg4" id="sugar">
                    <button data-sg="مضبوط" aria-pressed="true">مضبوط</button>
                    <button data-sg="أقل من وسط" aria-pressed="false">أقل من وسط</button>
                    <button data-sg="سكر خفيف" aria-pressed="false">خفيف</button>
                    <button data-sg="بدون سكر" aria-pressed="false">بدون</button>
                </div>
            </div>
            
            <label for="when">وقت الاستلام</label>
            <select id="when">
                <option>أقرب وقت (الآن)</option>
                <option>بعد 5 دقائق</option>
                <option>بعد 10 دقائق</option>
                <option>بعد 15 دقيقة</option>
                <option>بعد 30 دقيقة</option>
                <option>بعد ساعة</option>
            </select>
            
            <label for="name">الاسم (اختياري)</label>
            <input id="name" placeholder="أدخل اسمك لتسهيل الاستلام">
            
            <label for="note">ملاحظات إضافية</label>
            <input id="note" placeholder="مثال: زيادة نعناع، أو تجهيز الطلب سفري...">
            
            <button class="btn wa" id="send" style="width:100%;margin-top:30px; padding: 18px;"><i class="fa-brands fa-whatsapp fa-lg"></i> إرسال الطلب عبر واتساب</button>
            <button class="btn ghost arrived" id="here" style="color: var(--text-main); border-color: var(--border-color);"><i class="fa-solid fa-location-crosshairs"></i> أنا وصلت للمحل</button>
        </div>
    </div>

    <!-- نافذة النسخ (في حال عدم عمل الواتساب) -->
    <div class="sheet" id="fb">
        <div class="panel" role="dialog" style="max-width: 500px;">
            <button class="x" id="fbx" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="fbh" style="font-size: 1.3rem;"></h2>
            <textarea id="fbt" readonly></textarea>
            <button class="btn ghost" id="fbc" style="width:100%; margin-bottom: 15px; color: var(--text-main); border-color: var(--text-main);"><i class="fa-regular fa-copy"></i> نسخ نص الطلب</button>
            <a class="btn wa" id="fbl" target="_blank" rel="noopener" style="width:100%; display: flex; justify-content: center;"></a>
        </div>
    </div>

    <script>
        // --- إعدادات الوضع الداكن / الفاتح ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
        });

        // =========================================================================================
        // --- المنطق البرمجي (جافاسكريبت) ---
        // =========================================================================================
        
        var PHONE="966535536731";
        var T3=function(a,b,c){return[["صغير",a],["وسط",b],["كبير",c]]};
        var L3=function(a,b,c){return[["لتر",a],["لتر ونصف",b],["لترين",c]].filter(function(x){return x[1]})};
        var one=function(n,p,d){return{n:n,d:d||"",s:[["",p]]}};
        var tea=function(n,p,d){return{n:n,d:d||"",s:T3(3,5,p)}};
        
        var DATA={
            tea:[tea("سادة",7),tea("مخلوط الريف",7,"الخلطة الخاصة"),tea("حبق",7),tea("نعناع",7),tea("أزاب (بردقوش)",7),tea("مرمرية",7),tea("إكليل الجبل",7),tea("ورد مديني",7),tea("نعناع سادة (طائفي)",7),tea("مشروب السعادة، خلطة الشتاء",7,"زنجبيل وليمون ونعناع وزعفران"),tea("أخضر",6),tea("ينسون",6),tea("بابونج",6),tea("كركديه",6)],
            coffee:[{n:"دلة قهوة سعودية",d:"",s:T3(15,20,30)},{n:"كوب قهوة",d:"",s:T3(3,5,7)},{n:"قهوة تركي",d:"",s:T3(5,8,10)}],
            milk:[{n:"كوب حليب شاي",d:"",s:T3(3,5,7)},{n:"كوب حليب كرك",d:"",s:T3(4,6,8)},{n:"كوب حليب عدني",d:"",s:T3(3,5,7)},{n:"حليب شاي زنجبيل",d:"",s:T3(3,5,7)}],
            glass:[{n:"كوب زجاج شاي",d:"",s:T3(6,7,10)},{n:"كوب زجاج حليب",d:"",s:T3(6,7,10)},{n:"كوب زجاج كرك",d:"",s:T3(7,8,12)}],
            thermos:[
                {g:"براد وترمس تعبئة",n:"براد شاي",s:L3(10,15,20)},{n:"براد شاي حليب",s:L3(10,15,20)},{n:"براد شاي نعناع سادة",s:L3(10,15,20)},{n:"براد حليب عدني",s:L3(15,20,30)},{n:"براد حليب كرك",s:L3(15,20,30)},{n:"ترمس تعبئة شاي",s:L3(10,15,30)},{n:"ترمس تعبئة كرك",s:L3(15,20,30)},{n:"ترمس تعبئة قهوة سعودية",s:L3(15,20,30)},
                {g:"ترامس جديدة",n:"ترمس شاي",nw:1,s:L3(30,45,0)},{n:"ترمس حليب كرك",nw:1,s:L3(35,45,0)},{n:"ترمس قهوة سعودية",nw:1,s:L3(35,45,0)},
                {g:"ترامس نوع آخر",n:"ترمس شاي",nw:1,s:[["نصف لتر",20],["لتر",45]]},{n:"ترمس قهوة",nw:1,s:[["نصف لتر",25],["لتر",50]]}
            ],
            cold:[one("موهيتو التوت الأزرق",8),one("موهيتو التوت الأحمر",8),one("موهيتو الرمان",8),one("موهيتو فراولة",8),one("موهيتو كود رد",10,"توت أزرق، توت أحمر، رمان، فراولة")],
            jabati:[["بيض مقلي سادة",3],["بيض مقلي جبن",4],["بيض مقلي جبن بطاطس عمان",5],["بيض مسلوق سادة",3],["بيض مسلوق جبن",4],["جبن سائل",4],["جبن كيري",4],["جبن كرافت",5],["جبن بطاطس عمان",5],["جبن وحلاوى",5],["جبن زعتر",5],["لبنة زعتر",5],["لبنة عسل",5],["حلوم",6],["فول سوداني",5],["نوتيلا",5],["جبن مربّى",4]].map(function(a){return one("جباتي "+a[0],a[1])}),
            extra:[one("مكسرات ياباني (علبة)",4),one("مكسرات ملكي (علبة)",7),one("حب (دوار شمس، باجة)",3),one("ماء",1),one("تمر (علبة)",3)]
        };
        
        var CATS=[["tea","شاي"],["coffee","قهوة"],["milk","حليب"],["glass","كاسات زجاج"],["thermos","برادات وترامس"],["cold","باردة"],["jabati","جباتي"],["extra","ضيافة"]];
        var NOTES={thermos:"ترامس بأحجام وأنواع متعددة تناسب جلساتكم ورحلاتكم، اسأل عن الأنواع المتوفرة.",cold:"كاسة 12 أونص.",extra:"يُقدَّم مع الشاي تشكيلة متنوعة من البسكويت والمعمول والكليجا وغيرها."};
        var cart={},mode="shop",cat="tea",sel=0,sugar="مضبوط";
        var DR=["tea","coffee","milk","glass","thermos"];
        var $=function(i){return document.getElementById(i)};
        
        function store(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}
        
        function sizes(it,ix,single){
            return it.s.map(function(s,si){
                return '<button class="size" data-i="'+ix+'" data-s="'+si+'"><b>'+s[1]+' ر.س</b><span>'+(s[0]||"أضف")+'</span></button>'
            }).join("")
        }
        
        function tabs(){
            $("tabs").innerHTML=CATS.map(function(c){
                return '<button class="tab" data-c="'+c[0]+'" aria-pressed="'+(c[0]==cat)+'">'+c[1]+'</button>'
            }).join("")
        }
        
        function menu(){
            var L=DATA[cat],h="";
            if(cat=="tea"){
                h+='<div class="q">وش تحب نحط لك في الشاي؟</div><div class="chips">'+L.map(function(it,i){return '<button class="chip" data-t="'+i+'" aria-pressed="'+(i==sel)+'">'+it.n+'</button>'}).join("")+'</div>';
                var it=L[sel];
                h+='<div class="item" style="margin-top:14px"><h3><i class="fa-solid fa-leaf" style="color:var(--brand-primary)"></i> شاي '+it.n+'</h3>'+(it.d?'<p>'+it.d+'</p>':'<p></p>')+'<div class="sizes">'+sizes(it,sel)+'</div></div>'
            }
            else {
                L.forEach(function(it,ix){
                    if(it.g) h+='<div class="gh">'+it.g+'</div>';
                    var one1=it.s.length==1&&!it.s[0][0];
                    h+=one1?'<div class="item r1"><div><h3>'+it.n+'</h3>'+(it.d?'<p>'+it.d+'</p>':'')+'</div><div class="sizes">'+sizes(it,ix)+'</div></div>':'<div class="item"><h3>'+it.n+(it.nw?'<span class="new">جديد</span>':'')+'</h3>'+(it.d?'<p>'+it.d+'</p>':'<p></p>')+'<div class="sizes">'+sizes(it,ix)+'</div></div>'
                });
            }
            if(NOTES[cat]) h+='<div class="note"><i class="fa-solid fa-circle-info"></i> '+NOTES[cat]+'</div>';
            $("menu").innerHTML=h
        }
        
        function add(ix,si){
            var it=DATA[cat][ix],s=it.s[si],k=cat+"|"+ix+"|"+si,pre=cat=="tea"?"شاي ":"";
            if(!cart[k]) cart[k]={n:pre+it.n+(it.g=="ترامس نوع آخر"?" (نوع آخر)":"")+(s[0]?" ("+s[0]+")":""),p:s[1],q:0,cat:cat};
            cart[k].q++;
            draw()
        }
        
        function totals(){
            var q=0,t=0;
            for(var k in cart){q+=cart[k].q;t+=cart[k].q*cart[k].p}
            return[q,t]
        }
        
        function draw(){
            var T=totals();
            $("bar").hidden=T[0]==0;
            $("cnt").textContent=T[0];
            $("sum").textContent=T[1]+" ر.س";
            $("tot").textContent=T[1]+" ر.س";
            $("lines").innerHTML=Object.keys(cart).map(function(k){
                var c=cart[k];
                return '<div class="row"><div class="row-info">'+c.n+'<small>'+c.p*c.q+' ر.س</small></div><div class="qty"><button data-k="'+k+'" data-d="-1" aria-label="أنقص">−</button><b>'+c.q+'</b><button data-k="'+k+'" data-d="1" aria-label="زد">+</button></div></div>'
            }).join("");
            $("sugarbox").style.display=hasDrink()?"block":"none";
            if(T[0]==0)$("sheet").classList.remove("on")
        }
        
        function hasDrink(){
            return Object.keys(cart).some(function(k){return DR.indexOf(cart[k].cat)>-1})
        }
        
        function carText(){
            return"السيارة: "+($("ctype").value||"-")+"، "+($("ccolor").value||"-")+"، لوحة: "+($("cplate").value||"-")
        }
        
        function fb(h,x,u,l){
            $("fbh").textContent=h;
            $("fbt").value=x;
            $("fbl").href=u;
            $("fbl").innerHTML='<i class="fa-brands fa-whatsapp"></i> '+l;
            $("fbc").innerHTML='<i class="fa-regular fa-copy"></i> نسخ نص الطلب';
            $("fb").classList.add("on")
        }
        
        function wa(t){
            var u="https://wa.me/"+PHONE+"?text="+encodeURIComponent(t),w=null;
            try{w=window.open(u,"_blank")}catch(e){}
            if(!w)fb("تعذر فتح تطبيق الواتساب تلقائياً. يرجى نسخ الطلب وإرساله يدوياً على الرقم 0535536731",t,u,"إرسال واتساب")
        }
        
        var away=false;
        window.addEventListener("blur",function(){away=true});
        document.addEventListener("visibilitychange",function(){away=true});
        
        document.querySelector(".call-btn").addEventListener("click",function(){
            away=false;
            setTimeout(function(){
                if(!away)fb("للتواصل المباشر والاستفسارات، يسعدنا اتصالك على الرقم 0535536731","0535536731","tel:+966535536731","اتصال الآن")
            },1000)
        });
        
        $("fbc").onclick=function(){
            var x=$("fbt");
            x.select();
            try{document.execCommand("copy")}catch(e){}
            try{navigator.clipboard.writeText(x.value)}catch(e){}
            this.innerHTML='<i class="fa-solid fa-check"></i> تم النسخ بنجاح'
        };
        
        $("fbx").onclick=function(){$("fb").classList.remove("on")};
        $("fb").addEventListener("click",function(e){if(e.target==this)this.classList.remove("on")});
        
        function saveInfo(){
            store("jr_ct",$("ctype").value);
            store("jr_cc",$("ccolor").value);
            store("jr_cp",$("cplate").value);
            store("jr_nm",$("name").value)
        }
        
        function setMode(m){
            mode=m;
            [].forEach.call($("mode").children,function(b){b.setAttribute("aria-pressed",b.dataset.m==m)});
            $("carbox").classList.toggle("on",m=="car");
            $("here").classList.toggle("on",m=="car")
        }
        
        document.addEventListener("click",function(ev){
            var t=ev.target.closest("button");
            if(!t)return;
            
            if(t.classList.contains("tab")){cat=t.dataset.c;tabs();menu()}
            else if(t.classList.contains("chip")){sel=+t.dataset.t;menu()}
            else if(t.classList.contains("size")){add(+t.dataset.i,+t.dataset.s);if(navigator.vibrate)navigator.vibrate(20)}
            else if(t.dataset.k){var c=cart[t.dataset.k];c.q+=+t.dataset.d;if(c.q<=0)delete cart[t.dataset.k];draw()}
            else if(t.dataset.sg){sugar=t.dataset.sg;[].forEach.call($("sugar").children,function(b){b.setAttribute("aria-pressed",b===t)})}
            else if(t.dataset.m)setMode(t.dataset.m)
        });
        
        $("open").onclick=function(){$("sheet").classList.add("on")};
        $("close").onclick=function(){$("sheet").classList.remove("on")};
        $("sheet").addEventListener("click",function(e){if(e.target==this)this.classList.remove("on")});
        $("carlink").onclick=function(){setMode("car")};
        
        $("chat").onclick=function(e){e.preventDefault();wa("السلام عليكم")};
        
        $("send").onclick=function(){
            var T=totals();
            if(!T[0])return;
            saveInfo();
            
            var L=["*السلام عليكم، طلب جديد من شاي جمر الريف:*",""];
            for(var k in cart){
                var c=cart[k];
                L.push("▪️ "+c.q+" × "+c.n+" = "+c.q*c.p+" ر.س")
            }
            L.push("","*المجموع:* "+T[1]+" ر.س","*الاستلام:* "+(mode=="car"?"🚗 من السيارة":"🏪 من المحل"));
            
            if(mode=="car")L.push("📝 "+carText());
            if(hasDrink())L.push("🧊 *السكر:* "+sugar);
            
            L.push("⏱️ *الوقت:* "+$("when").value);
            if($("name").value)L.push("👤 *الاسم:* "+$("name").value);
            if($("note").value)L.push("📌 *ملاحظات:* "+$("note").value);
            
            wa(L.join("\n"))
        };
        
        $("here").onclick=function(){
            saveInfo();
            wa("أنا وصلت للمحل لاستلام طلبي.\n"+carText()+($("name").value?"\nالاسم: "+$("name").value:""))
        };
        
        $("ctype").value=store("jr_ct");
        $("ccolor").value=store("jr_cc");
        $("cplate").value=store("jr_cp");
        $("name").value=store("jr_nm");
        
        tabs();
        menu();
        draw();
    </script>
</body>
</html>
